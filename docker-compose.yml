services:
  lesson-api:
    image: lesson_api
    container_name: lesson_api
    build:
      context: ./Lesson-service/
    ports:
      - "3333:3333"
    depends_on:
      postgresql:
        condition: service_healthy
    environment:
      POSTGRE_DB: ${POSTGRE_DB}  

  postgresql:
    container_name: postgresql
    image: postgres:18.4-alpine3.23
    ports:
      - "5432:5432" #TODO : Expose port only in dev mode, not in production
    environment:
      POSTGRES_USER: ${POSTGRE_USER}
      POSTGRES_PASSWORD: ${POSTGRE_PASSWORD}
      POSTGRES_DB: ${POSTGRE_DB}
    volumes:
      - ./postgresql-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready", "-d", "${POSTGRE_DB}"]
      interval: 30s
      timeout: 60s
      retries: 5
      start_period: 10s
    restart: unless-stopped